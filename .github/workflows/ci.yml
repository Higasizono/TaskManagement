name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: フロントエンド（Lint / 型チェック / ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint（oxlint）
        run: npm run lint

      - name: 型チェック（tsc）
        run: npm run typecheck

      - name: ビルド
        run: npm run build

  backend:
    name: バックエンド（フォーマット / Checkstyle / テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # check = spotlessCheck + checkstyleMain + checkstyleTest + test
      # 既存テストは @WebMvcTest と Mockito のみでDBに接続しないため、PostgreSQLは不要。
      - name: check（Spotless / Checkstyle / JUnit）
        run: ./gradlew check --no-daemon
